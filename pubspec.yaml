name: expense_tracker
description: A personal budget and expense tracker built with Flutter, Riverpod 3 and Hive CE.
publish_to: "none"

version: 1.0.0+1

environment:
  # Riverpod 3.2.x requires Dart 3.7.0 or newer.
  sdk: ">=3.7.0 <4.0.0"
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter

  # State management.
  flutter_riverpod: 3.2.1
  riverpod_annotation: 4.0.2

  # Local offline database.
  hive_ce: 2.22.0
  hive_ce_flutter: 2.3.3

  # Immutable value objects.
  equatable: 2.0.7

  # Currency, date and number formatting.
  intl: 0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code generation.
  build_runner: 2.7.1
  riverpod_generator: 4.0.3
  hive_ce_generator: 1.12.0

  # Static analysis.
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
